<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>קזינו — לובי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080f; --surface:#12121e; --card:#1a1a2e;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
  --text:#f0f2ff; --muted:#7a7d99; --sub:#4a4d6a;
  --gold:#ffce3a; --green:#34d399; --red:#ff5470;
  --blue:#46d6ff; --purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}

html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:'Heebo',system-ui,sans-serif;
  display:flex;flex-direction:column;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#0d0520,#12121e);
  border-bottom:1px solid var(--border);
  padding:18px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.header-title{
  font-family:'Rubik';font-weight:900;font-size:28px;
  background:linear-gradient(90deg,var(--gold),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header-sub{color:var(--muted);font-size:13px;margin-top:1px}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 100px}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:50;
}
.nav-btn{
  flex:1;border:none;background:none;color:var(--muted);
  padding:14px 0 18px;font-family:'Heebo';font-weight:700;font-size:13px;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.nav-btn .nav-ico{font-size:22px}
.nav-btn.active{color:var(--gold)}
.nav-btn.active .nav-ico{filter:drop-shadow(0 0 8px rgba(255,206,58,.6))}

/* ── SCREENS ── */
.screen{display:none}
.screen.active{display:block}

/* ── SECTION TITLE ── */
.section-title{
  font-family:'Rubik';font-weight:900;font-size:22px;margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}

/* ── PLAYER GRID ── */
.player-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}
@media(min-width:700px){.player-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.player-grid{grid-template-columns:repeat(4,1fr)}}

.player-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:20px;
  padding:22px 16px 18px;text-align:center;cursor:pointer;
  transition:.18s;position:relative;
}
.player-card:active{transform:scale(.97)}
.player-card:hover{border-color:var(--border2)}
.player-card.add-card{border-style:dashed;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;justify-content:center;min-height:160px;gap:8px}
.player-card.add-card .add-ico{font-size:36px;color:var(--sub)}
.player-card.guest-card{border-color:rgba(74,77,106,.5)}

.pc-emoji{font-size:52px;margin-bottom:10px;display:block;line-height:1}
.pc-name{font-family:'Rubik';font-weight:900;font-size:18px;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-stats{font-size:12px;color:var(--muted);line-height:1.6}
.pc-stats .w{color:var(--green)}
.pc-stats .l{color:var(--red)}
.pc-stats .t{color:var(--blue)}
.pc-badge{
  position:absolute;top:10px;left:10px;
  background:var(--gold);color:#1a0d00;
  font:900 10px 'Rubik';border-radius:20px;padding:2px 8px;
}

/* ── LEADERBOARD ── */
.lb-table{width:100%;border-collapse:collapse}
.lb-table th{
  color:var(--muted);font:700 12px 'Heebo';padding:10px 12px;
  text-align:center;border-bottom:1px solid var(--border);letter-spacing:.5px;
}
.lb-table th:first-child{text-align:right}
.lb-table td{
  padding:14px 12px;text-align:center;
  border-bottom:1px solid var(--border);font-size:15px;
}
.lb-table td:first-child{text-align:right}
.lb-table tr:last-child td{border-bottom:none}
.lb-table tbody tr{cursor:pointer;transition:.12s}
.lb-table tbody tr:active{background:rgba(255,255,255,.04)}
.lb-table tbody tr:hover{background:rgba(255,255,255,.03)}
.rank{font:900 15px 'Rubik';color:var(--muted)}
.rank.r1{color:var(--gold);font-size:18px}
.rank.r2{color:#c0c0c0}
.rank.r3{color:#cd7f32}
.lb-name{display:flex;align-items:center;gap:10px}
.lb-emoji{font-size:26px}
.lb-pname{font-family:'Rubik';font-weight:700;font-size:16px}
.lb-sub{font-size:11px;color:var(--muted)}
td.w{color:var(--green);font:900 16px 'Rubik'}
td.l{color:var(--red);font:900 16px 'Rubik'}
td.t{color:var(--blue);font:900 16px 'Rubik'}
td.tot{color:var(--text);font:700 15px 'Heebo'}
td.pct{color:var(--gold);font:900 15px 'Rubik'}
.lb-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}

/* ── OVERLAYS ── */
.overlay-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay-bg.open{opacity:1;pointer-events:all}
.overlay-sheet{
  background:var(--surface);border-radius:28px 28px 0 0;
  border-top:1px solid var(--border2);padding:24px 24px 40px;
  width:100%;max-width:600px;max-height:90vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);
}
.overlay-bg.open .overlay-sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--sub);border-radius:4px;
  margin:0 auto 20px;display:block}

/* Game select overlay */
.gs-player{text-align:center;margin-bottom:28px}
.gs-emoji{font-size:64px;display:block;margin-bottom:10px}
.gs-name{font-family:'Rubik';font-weight:900;font-size:28px}
.gs-sub{color:var(--muted);font-size:14px;margin-top:4px}

.game-btns{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.game-btn{
  background:var(--card);border:1.5px solid var(--border2);border-radius:18px;
  padding:20px 24px;cursor:pointer;transition:.18s;
  display:flex;align-items:center;gap:18px;
}
.game-btn:active{transform:scale(.98)}
.game-btn:hover{border-color:var(--gold)}
.game-btn .gb-ico{font-size:36px;flex-shrink:0}
.game-btn .gb-text{text-align:right}
.game-btn .gb-name{font-family:'Rubik';font-weight:900;font-size:20px}
.game-btn .gb-desc{font-size:13px;color:var(--muted);margin-top:2px}

.ghost-btn{
  width:100%;border:none;background:none;color:var(--muted);
  font:700 14px 'Heebo';padding:12px;cursor:pointer;
  border-radius:12px;transition:.15s;
}
.ghost-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}

/* Stats overlay */
.stats-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.stats-emoji{font-size:56px;flex-shrink:0}
.stats-info{}
.stats-pname{font-family:'Rubik';font-weight:900;font-size:24px}
.stats-since{font-size:12px;color:var(--muted);margin-top:2px}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 8px;text-align:center}
.stat-box .sv{font-family:'Rubik';font-weight:900;font-size:24px;display:block;margin-bottom:2px}
.stat-box .sl{font-size:11px;color:var(--muted)}
.sv.w{color:var(--green)} .sv.l{color:var(--red)} .sv.t{color:var(--blue)} .sv.pct{color:var(--gold)}

.history-title{font-family:'Rubik';font-weight:700;font-size:16px;
  margin-bottom:12px;color:var(--muted);letter-spacing:.3px}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 16px;display:flex;align-items:center;gap:14px;
}
.hi-result{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font:900 12px 'Rubik';flex-shrink:0}
.hi-result.w{background:rgba(52,211,153,.15);color:var(--green);border:1.5px solid var(--green)}
.hi-result.l{background:rgba(255,84,112,.15);color:var(--red);border:1.5px solid var(--red)}
.hi-result.t{background:rgba(70,214,255,.15);color:var(--blue);border:1.5px solid var(--blue)}
.hi-info{flex:1}
.hi-game{font-weight:700;font-size:14px}
.hi-date{font-size:11px;color:var(--muted);margin-top:1px}
.hi-empty{color:var(--muted);text-align:center;padding:30px;font-size:15px}

/* Add player overlay */
.add-form{display:flex;flex-direction:column;gap:16px}
.form-label{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
.form-input{
  width:100%;background:var(--card);border:1.5px solid var(--border2);
  color:var(--text);border-radius:14px;padding:14px 16px;
  font:700 18px 'Rubik';-webkit-user-select:text;user-select:text;
}
.form-input:focus{outline:none;border-color:var(--gold)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(min-width:500px){.emoji-grid{grid-template-columns:repeat(8,1fr)}}
.emoji-opt{
  background:var(--card);border:2px solid transparent;border-radius:12px;
  font-size:28px;padding:8px 4px;cursor:pointer;text-align:center;transition:.12s;
  display:grid;place-items:center;
}
.emoji-opt:active{transform:scale(.9)}
.emoji-opt.selected{border-color:var(--gold);background:rgba(255,206,58,.1)}

.sheet-actions{display:flex;gap:10px;margin-top:4px}
.sheet-btn{
  flex:1;border:none;border-radius:14px;padding:16px;
  font-family:'Rubik';font-weight:900;font-size:16px;cursor:pointer;transition:.15s;
}
.sheet-btn.primary{background:linear-gradient(135deg,var(--gold),#ff9a3c);color:#1a0d00}
.sheet-btn.secondary{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.sheet-btn:active{transform:scale(.97)}

.back-btn{
  display:flex;align-items:center;gap:8px;border:none;background:none;
  color:var(--muted);font:700 14px 'Heebo';cursor:pointer;margin-bottom:20px;padding:4px 0;
}
.back-btn:hover{color:var(--text)}

/* Delete player button */
.del-btn{
  width:100%;border:1px solid rgba(255,84,112,.3);background:none;color:var(--red);
  border-radius:12px;padding:12px;font:700 14px 'Heebo';cursor:pointer;margin-top:12px;
}
.del-btn:hover{background:rgba(255,84,112,.08)}

/* Toast */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#06150e;padding:12px 24px;border-radius:30px;
  font:700 14px 'Heebo';opacity:0;transition:.3s;z-index:200;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-title">🎰 קזינו</div>
    <div class="header-sub">בחר שחקן ותתחיל לשחק</div>
  </div>
</div>

<!-- CONTENT -->
<div class="content" id="content">

  <!-- SCREEN: Players -->
  <div class="screen active" id="screen-players">
    <div class="section-title">👥 מי משחק?</div>
    <div class="player-grid" id="playerGrid"></div>
  </div>

  <!-- SCREEN: Leaderboard -->
  <div class="screen" id="screen-leaderboard">
    <div class="section-title">🏆 לוח תוצאות</div>
    <div id="lbContent"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="navPlayers" onclick="showScreen('players')">
    <span class="nav-ico">👥</span>שחקנים
  </button>
  <button class="nav-btn" id="navLeaderboard" onclick="showScreen('leaderboard')">
    <span class="nav-ico">🏆</span>לוח תוצאות
  </button>
</nav>

<!-- OVERLAY: Game Select -->
<div class="overlay-bg" id="overlayGame" onclick="closeOverlay(event,'overlayGame')">
  <div class="overlay-sheet">
    <span class="sheet-handle"></span>
    <div class="gs-player">
      <span class="gs-emoji" id="gsEmoji"></span>
      <div class="gs-name" id="gsName"></div>
      <div class="gs-sub" id="gsSub"></div>
    </div>
    <div class="game-btns">
      <button class="game-btn" id="btnBJ" onclick="launchGame('blackjack')">
        <span class="gb-ico">🃏</span>
        <div class="gb-text">
          <div class="gb-name">בלאק ג'ק</div>
          <div class="gb-desc">שולחן עם 5 ידיים מול הדילר</div>
        </div>
      </button>
      <button class="game-btn" id="btnBAC" onclick="launchGame('baccarat')">
        <span class="gb-ico">🎴</span>
        <div class="gb-text">
          <div class="gb-name">באקרט</div>
          <div class="gb-desc">שחקן מול בנקר</div>
        </div>
      </button>
      <button class="game-btn" id="btnCRAPS" onclick="launchGame('craps')">
        <span class="gb-ico">🎲</span>
        <div class="gb-text">
          <div class="gb-name">קראפס</div>
          <div class="gb-desc">Pass Line · Field · Place Bets</div>
        </div>
      </button>
    </div>
    <button class="ghost-btn" id="btnMyStats" onclick="openMyStats()">📊 הסטטיסטיקות שלי</button>
    <button class="ghost-btn" style="color:var(--red)" onclick="closeOverlayById('overlayGame')">ביטול ✕</button>
  </div>
</div>

<!-- OVERLAY: Player Stats -->
<div class="overlay-bg" id="overlayStats" onclick="closeOverlay(event,'overlayStats')">
  <div class="overlay-sheet" style="max-height:85vh">
    <span class="sheet-handle"></span>
    <button class="back-btn" onclick="closeOverlayById('overlayStats')">← חזרה</button>
    <div class="stats-header">
      <span class="stats-emoji" id="statsEmoji"></span>
      <div class="stats-info">
        <div class="stats-pname" id="statsPname"></div>
        <div class="stats-since" id="statsSince"></div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><span class="sv w" id="sv-wins">0</span><span class="sl">ניצחונות</span></div>
      <div class="stat-box"><span class="sv l" id="sv-losses">0</span><span class="sl">הפסדים</span></div>
      <div class="stat-box"><span class="sv t" id="sv-ties">0</span><span class="sl">תיקו</span></div>
      <div class="stat-box"><span class="sv pct" id="sv-pct">—</span><span class="sl">% ניצחון</span></div>
    </div>
    <div class="history-title">היסטוריית משחקים</div>
    <div class="history-list" id="historyList"></div>
    <button class="del-btn" id="delPlayerBtn">🗑️ מחק שחקן</button>
  </div>
</div>

<!-- OVERLAY: Add Player -->
<div class="overlay-bg" id="overlayAdd" onclick="closeOverlay(event,'overlayAdd')">
  <div class="overlay-sheet">
    <span class="sheet-handle"></span>
    <div class="section-title" style="font-size:20px;margin-bottom:16px">➕ שחקן חדש</div>
    <div class="add-form">
      <div>
        <label class="form-label">שם השחקן</label>
        <input class="form-input" id="newPlayerName" type="text" placeholder="הכנס שם..." maxlength="20" autocomplete="off">
      </div>
      <div>
        <label class="form-label">בחר אווטאר</label>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <div class="sheet-actions">
        <button class="sheet-btn secondary" onclick="closeOverlayById('overlayAdd')">ביטול</button>
        <button class="sheet-btn primary" onclick="confirmAddPlayer()">הוסף שחקן ✓</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════
   DATA LAYER
═══════════════════════════════════════════════ */
const STORAGE_KEY = "casinoPlayers";

function loadData(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {players:[]}; }
  catch(e){ return {players:[]}; }
}
function saveData(data){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function getStats(player){
  const games = player.games || [];
  const wins   = games.filter(g=>g.result==='win').length;
  const losses = games.filter(g=>g.result==='loss').length;
  const ties   = games.filter(g=>g.result==='tie').length;
  const total  = games.length;
  const pct    = total>0 ? Math.round(wins/total*100) : null;
  return {wins,losses,ties,total,pct};
}

function addPlayer(name, emoji){
  const data = loadData();
  const player = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: name.trim(),
    emoji,
    createdAt: new Date().toISOString(),
    games: []
  };
  data.players.push(player);
  saveData(data);
  return player;
}

function deletePlayer(pid){
  const data = loadData();
  data.players = data.players.filter(p=>p.id!==pid);
  saveData(data);
}

/* ═══════════════════════════════════════════════
   CURRENT SESSION
═══════════════════════════════════════════════ */
let currentPid = null; // null = guest

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');
  if(id==='leaderboard') renderLeaderboard();
}

function openOverlay(id){ document.getElementById(id).classList.add('open'); }
function closeOverlayById(id){ document.getElementById(id).classList.remove('open'); }
function closeOverlay(e, id){
  if(e.target.id===id) closeOverlayById(id);
}

/* ═══════════════════════════════════════════════
   PLAYER SELECT → GAME SELECT OVERLAY
═══════════════════════════════════════════════ */
function selectPlayer(pid){
  const data = loadData();
  const player = pid ? data.players.find(p=>p.id===pid) : null;
  currentPid = pid || null;

  if(player){
    document.getElementById('gsEmoji').textContent = player.emoji;
    document.getElementById('gsName').textContent  = player.name;
    const s = getStats(player);
    document.getElementById('gsSub').textContent = s.total>0
      ? `${s.total} משחקים · ${s.wins} ניצחונות · ${s.pct}% ניצחון`
      : 'עדיין לא שיחקת';
    document.getElementById('btnMyStats').style.display = '';
  } else {
    // Guest
    document.getElementById('gsEmoji').textContent = '👤';
    document.getElementById('gsName').textContent  = 'אורח';
    document.getElementById('gsSub').textContent   = 'ללא שמירת היסטוריה';
    document.getElementById('btnMyStats').style.display = 'none';
  }
  openOverlay('overlayGame');
}

function launchGame(type){
  closeOverlayById('overlayGame');
  const url = type==='blackjack' ? 'tools/blackjack.html'
            : type==='baccarat'  ? 'tools/baccarat.html'
            : 'tools/craps.html';
  const params = currentPid ? `?pid=${encodeURIComponent(currentPid)}` : '';
  window.location.href = url + params;
}

function openMyStats(){
  if(!currentPid) return;
  closeOverlayById('overlayGame');
  renderPlayerStats(currentPid);
  openOverlay('overlayStats');
}

/* ═══════════════════════════════════════════════
   PLAYER STATS OVERLAY
═══════════════════════════════════════════════ */
let statsViewPid = null;

function renderPlayerStats(pid){
  statsViewPid = pid;
  const data = loadData();
  const player = data.players.find(p=>p.id===pid);
  if(!player) return;

  document.getElementById('statsEmoji').textContent = player.emoji;
  document.getElementById('statsPname').textContent = player.name;
  const created = new Date(player.createdAt);
  document.getElementById('statsSince').textContent =
    'הצטרף: ' + created.toLocaleDateString('he-IL');

  const s = getStats(player);
  document.getElementById('sv-wins').textContent   = s.wins;
  document.getElementById('sv-losses').textContent = s.losses;
  document.getElementById('sv-ties').textContent   = s.ties;
  document.getElementById('sv-pct').textContent    = s.pct!==null ? s.pct+'%' : '—';

  const list = document.getElementById('historyList');
  const games = [...(player.games||[])].reverse();
  if(games.length===0){
    list.innerHTML = '<div class="hi-empty">אין משחקים עדיין 🎮</div>';
  } else {
    list.innerHTML = games.map(g=>{
      const d = new Date(g.date);
      const dateStr = d.toLocaleDateString('he-IL') + ' · ' +
                      d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
      const rCls = g.result==='win'?'w':g.result==='loss'?'l':'t';
      const rTxt = g.result==='win'?'WIN':g.result==='loss'?'LOSS':'TIE';
      const gameIco = g.type==='blackjack'?'🃏':g.type==='craps'?'🎲':'🎴';
      const gameName = g.type==='blackjack'?'בלאק ג\'ק':g.type==='craps'?'קראפס':'באקרט';
      return `
        <div class="history-item">
          <div class="hi-result ${rCls}">${rTxt}</div>
          <div class="hi-info">
            <div class="hi-game">${gameIco} ${gameName}</div>
            <div class="hi-date">${dateStr}</div>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('delPlayerBtn').onclick = ()=>{
    if(!confirm(`למחוק את ${player.name}? כל ההיסטוריה תאבד.`)) return;
    deletePlayer(pid);
    closeOverlayById('overlayStats');
    renderPlayerGrid();
    showToast('השחקן נמחק');
  };
}

function openPlayerStats(pid){
  renderPlayerStats(pid);
  openOverlay('overlayStats');
}

/* ═══════════════════════════════════════════════
   ADD PLAYER OVERLAY
═══════════════════════════════════════════════ */
const EMOJIS = ['🎯','🎲','🃏','♠️','♥️','♦️','♣️','🎰','🏆','⭐','🔥','💎',
                '🐉','🦁','🐯','🦊','🐺','🦅','👑','🌟','🎭','🚀','💫','🌈',
                '🍀','🔮','⚡','🎸','🎪','🎨'];
let selEmoji = EMOJIS[0];

function renderEmojiGrid(){
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJIS.map(e=>`
    <button class="emoji-opt${e===selEmoji?' selected':''}" onclick="pickEmoji('${e}')">${e}</button>
  `).join('');
}
function pickEmoji(e){
  selEmoji=e;
  renderEmojiGrid();
}

function openAddPlayer(){
  selEmoji = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  document.getElementById('newPlayerName').value='';
  renderEmojiGrid();
  openOverlay('overlayAdd');
  setTimeout(()=>document.getElementById('newPlayerName').focus(),350);
}

function confirmAddPlayer(){
  const name = document.getElementById('newPlayerName').value.trim();
  if(!name){ showToast('הכנס שם לשחקן'); return; }
  const data = loadData();
  if(data.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
    showToast('שחקן עם השם הזה כבר קיים');
    return;
  }
  const player = addPlayer(name, selEmoji);
  closeOverlayById('overlayAdd');
  renderPlayerGrid();
  showToast(`${selEmoji} ${player.name} נוסף!`);
}

/* ═══════════════════════════════════════════════
   RENDER PLAYER GRID
═══════════════════════════════════════════════ */
function renderPlayerGrid(){
  const data = loadData();
  const grid = document.getElementById('playerGrid');
  grid.innerHTML = '';

  // Guest card
  const guestCard = document.createElement('div');
  guestCard.className = 'player-card guest-card';
  guestCard.innerHTML = `
    <span class="pc-emoji">👤</span>
    <div class="pc-name">אורח</div>
    <div class="pc-stats">ללא שמירת נתונים</div>`;
  guestCard.onclick = ()=>selectPlayer(null);
  grid.appendChild(guestCard);

  // Player cards
  data.players.forEach((player, idx)=>{
    const s = getStats(player);
    const card = document.createElement('div');
    card.className = 'player-card';
    if(idx===0) card.innerHTML += `<div class="pc-badge">חדש</div>`;
    card.innerHTML += `
      <span class="pc-emoji">${player.emoji}</span>
      <div class="pc-name">${player.name}</div>
      <div class="pc-stats">
        ${s.total>0
          ? `<span class="w">▲${s.wins}</span> · <span class="l">▼${s.losses}</span> · <span class="t">~${s.ties}</span><br>${s.total} משחקים`
          : 'עדיין לא שיחקת'}
      </div>`;
    card.onclick = ()=>selectPlayer(player.id);
    grid.appendChild(card);
  });

  // Add player card
  const addCard = document.createElement('div');
  addCard.className = 'player-card add-card';
  addCard.innerHTML = `<div class="add-ico">➕</div><div style="font:700 14px Heebo;color:var(--muted)">הוסף שחקן</div>`;
  addCard.onclick = openAddPlayer;
  grid.appendChild(addCard);
}

/* ═══════════════════════════════════════════════
   RENDER LEADERBOARD
═══════════════════════════════════════════════ */
function renderLeaderboard(){
  const data = loadData();
  const lb = document.getElementById('lbContent');

  if(data.players.length===0){
    lb.innerHTML = '<div class="lb-empty">🏆<br><br>אין שחקנים רשומים עדיין<br><span style="font-size:13px">הוסף שחקן מהטאב "שחקנים"</span></div>';
    return;
  }

  const players = data.players.map(p=>({p, s:getStats(p)}))
    .sort((a,b)=>b.s.wins-a.s.wins||a.s.losses-b.s.losses);

  const rankClass = i=>i===0?'r1':i===1?'r2':i===2?'r3':'';
  const rankStr = i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;

  lb.innerHTML = `
    <table class="lb-table">
      <thead>
        <tr>
          <th>#</th>
          <th style="text-align:right">שחקן</th>
          <th>WIN</th>
          <th>LOSS</th>
          <th>TIE</th>
          <th>סה"כ</th>
          <th>WIN%</th>
        </tr>
      </thead>
      <tbody>
        ${players.map(({p,s},i)=>`
          <tr onclick="openPlayerStats('${p.id}')">
            <td><span class="rank ${rankClass(i)}">${rankStr(i)}</span></td>
            <td>
              <div class="lb-name">
                <span class="lb-emoji">${p.emoji}</span>
                <div>
                  <div class="lb-pname">${p.name}</div>
                  <div class="lb-sub">${s.total} משחקים</div>
                </div>
              </div>
            </td>
            <td class="w">${s.wins}</td>
            <td class="l">${s.losses}</td>
            <td class="t">${s.ties}</td>
            <td class="tot">${s.total}</td>
            <td class="pct">${s.pct!==null?s.pct+'%':'—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
renderPlayerGrid();
</script>
</body>
</html>
