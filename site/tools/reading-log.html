<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן קריאה — המרכז שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d14;color:#f4f6fb;font-family:'Heebo',sans-serif;min-height:100vh;padding:20px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  background:#141826;border:1px solid rgba(255,255,255,.1);color:#f4f6fb;
  border-radius:14px;padding:10px 18px;font:700 14px 'Heebo';text-decoration:none}
.back:hover{background:#1c2233}
h1{font-family:'Rubik';font-size:28px;font-weight:900;margin-bottom:4px}
.sub{color:#9aa3b5;font-size:13px;margin-bottom:24px}
.wrap{max-width:700px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;text-align:center}
.stat .num{font-family:'Rubik';font-size:26px;font-weight:900;color:#60a5fa}
.stat .lbl{font-size:11px;color:#9aa3b5;margin-top:3px}
.card{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-family:'Rubik';font-size:14px;color:#9aa3b5;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.form textarea,.form select{background:#0d1117;border:1px solid rgba(255,255,255,.15);
  color:#f4f6fb;font:500 14px 'Heebo';border-radius:12px;padding:11px 14px}
.form textarea{resize:vertical;min-height:65px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row input,.form-row select{flex:1;min-width:110px}
.btn{padding:12px 20px;border-radius:12px;border:none;font:700 14px 'Heebo';cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;transition:opacity .15s;width:100%}
.btn:hover{opacity:.85}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:#9aa3b5;font:600 13px 'Heebo';cursor:pointer}
.tab.active{background:#1d4ed8;border-color:#3b82f6;color:white}
.book-item{display:flex;gap:12px;background:#0d1117;border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:14px;margin-bottom:10px;align-items:flex-start}
.book-cover{font-size:36px;flex:none}
.book-info{flex:1}
.book-title{font-family:'Rubik';font-size:16px;font-weight:700}
.book-author{font-size:12.5px;color:#9aa3b5;margin-top:2px}
.book-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.badge{padding:3px 8px;border-radius:6px;font:600 11px 'Heebo'}
.badge.read{background:rgba(22,163,74,.2);color:#4ade80}
.badge.reading{background:rgba(59,130,246,.2);color:#93c5fd}
.badge.want{background:rgba(234,179,8,.2);color:#fde68a}
.book-note{font-size:12px;color:#9aa3b5;margin-top:6px;line-height:1.5}
.book-actions{display:flex;flex-direction:column;gap:4px}
.act-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:4px}
.progress{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:8px}
.progress-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#3b82f6,#2dd4bf);transition:width .3s}
</style>
</head>
<body>
<a href="../districts/growth/" class="back">→ שיפור עצמי</a>
<div class="wrap">
<h1>📚 יומן קריאה</h1>
<div class="sub">ספרים שקראתי, קורא, ורוצה לקרוא</div>

<div class="stats">
  <div class="stat"><div class="num" id="sRead">0</div><div class="lbl">נקראו</div></div>
  <div class="stat"><div class="num" id="sReading">0</div><div class="lbl">קורא</div></div>
  <div class="stat"><div class="num" id="sWant">0</div><div class="lbl">רוצה לקרוא</div></div>
</div>

<div class="card">
  <h3>📖 הוסף ספר</h3>
  <div class="form">
    <input type="text" id="bTitle" placeholder="שם הספר *">
    <input type="text" id="bAuthor" placeholder="מחבר">
    <div class="form-row">
      <select id="bStatus">
        <option value="want">רוצה לקרוא 📌</option>
        <option value="reading">קורא כרגע 📖</option>
        <option value="read">סיימתי ✅</option>
      </select>
      <input type="number" id="bPages" placeholder="עמודים">
      <input type="number" id="bCurrentPage" placeholder="עמוד נוכחי">
    </div>
    <input type="number" id="bRating" min="1" max="5" placeholder="דירוג 1-5 ⭐">
    <textarea id="bNote" placeholder="תובנה / מה אהבתי..."></textarea>
    <button class="btn" onclick="addBook()">הוסף ספר</button>
  </div>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="setFilter('all',this)">הכל</button>
    <button class="tab" onclick="setFilter('reading',this)">קורא</button>
    <button class="tab" onclick="setFilter('read',this)">נקרא</button>
    <button class="tab" onclick="setFilter('want',this)">רשימה</button>
  </div>
  <div id="bookList"></div>
</div>
</div>

<script>
let books=JSON.parse(localStorage.getItem('reading_log')||'[]');
let filter='all';

const ICONS={'want':'📌','reading':'📖','read':'✅'};
const statusName={'want':'רוצה לקרוא','reading':'קורא','read':'נקרא'};

function addBook(){
  const title=document.getElementById('bTitle').value.trim();
  if(!title)return;
  books.unshift({
    id:Date.now(),title,
    author:document.getElementById('bAuthor').value.trim(),
    status:document.getElementById('bStatus').value,
    pages:parseInt(document.getElementById('bPages').value)||0,
    currentPage:parseInt(document.getElementById('bCurrentPage').value)||0,
    rating:parseInt(document.getElementById('bRating').value)||0,
    note:document.getElementById('bNote').value.trim(),
    date:new Date().toLocaleDateString('he-IL')
  });
  ['bTitle','bAuthor','bPages','bCurrentPage','bRating','bNote'].forEach(id=>document.getElementById(id).value='');
  save();render();
}

function delBook(id){books=books.filter(b=>b.id!==id);save();render();}
function setFilter(f,el){filter=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}

function render(){
  const shown=filter==='all'?books:books.filter(b=>b.status===filter);
  document.getElementById('sRead').textContent=books.filter(b=>b.status==='read').length;
  document.getElementById('sReading').textContent=books.filter(b=>b.status==='reading').length;
  document.getElementById('sWant').textContent=books.filter(b=>b.status==='want').length;
  const el=document.getElementById('bookList');
  if(!shown.length){el.innerHTML='<div style="color:#9aa3b5;font-size:13px;text-align:center;padding:12px">אין ספרים</div>';return;}
  el.innerHTML=shown.map(b=>{
    const pct=b.pages&&b.currentPage?Math.min(100,Math.round(b.currentPage/b.pages*100)):0;
    return `<div class="book-item">
      <div class="book-cover">${ICONS[b.status]}</div>
      <div class="book-info">
        <div class="book-title">${b.title}</div>
        ${b.author?`<div class="book-author">${b.author}</div>`:''}
        <div class="book-meta">
          <span class="badge ${b.status}">${statusName[b.status]}</span>
          ${b.rating?'⭐'.repeat(b.rating):''}
        </div>
        ${b.status==='reading'&&b.pages?`<div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div style="font-size:11px;color:#9aa3b5;margin-top:3px">${pct}% (${b.currentPage}/${b.pages})</div>`:''}
        ${b.note?`<div class="book-note">${b.note}</div>`:''}
      </div>
      <div class="book-actions">
        <button class="act-btn" onclick="delBook(${b.id})">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function save(){localStorage.setItem('reading_log',JSON.stringify(books));}
render();
</script>
</body>
</html>
