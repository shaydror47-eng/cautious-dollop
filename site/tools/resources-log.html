<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן משאבים — המרכז שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d14;color:#f4f6fb;font-family:'Heebo',sans-serif;min-height:100vh;padding:20px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  background:#141826;border:1px solid rgba(255,255,255,.1);color:#f4f6fb;
  border-radius:14px;padding:10px 18px;font:700 14px 'Heebo';text-decoration:none}
.back:hover{background:#1c2233}
h1{font-family:'Rubik';font-size:28px;font-weight:900;margin-bottom:4px}
.sub{color:#9aa3b5;font-size:13px;margin-bottom:24px}
.wrap{max-width:700px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;text-align:center}
.stat .num{font-family:'Rubik';font-size:24px;font-weight:900;color:#38bdf8}
.stat .lbl{font-size:11px;color:#9aa3b5;margin-top:2px}
.card{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-family:'Rubik';font-size:14px;color:#9aa3b5;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.form select,.form textarea{background:#0d1117;border:1px solid rgba(255,255,255,.15);
  color:#f4f6fb;font:500 14px 'Heebo';border-radius:12px;padding:11px 14px;width:100%}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row > *{flex:1;min-width:110px}
.btn{padding:12px;border-radius:12px;border:none;font:700 14px 'Heebo';cursor:pointer;
  background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;transition:opacity .15s;width:100%}
.btn:hover{opacity:.85}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:transparent;color:#9aa3b5;font:600 12px 'Heebo';cursor:pointer}
.tab.active{background:rgba(2,132,199,.2);border-color:#0284c7;color:#38bdf8}
.res-item{background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:8px}
.res-item:hover{border-color:rgba(56,189,248,.2)}
.res-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.res-title{font-family:'Rubik';font-size:15px;font-weight:700}
.res-del{background:none;border:none;color:#6b7280;cursor:pointer;font-size:15px}
.res-del:hover{color:#ef4444}
.badge{padding:3px 8px;border-radius:6px;font:600 11px 'Heebo'}
.res-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.res-note{font-size:13px;color:#9aa3b5;line-height:1.5;margin-bottom:4px}
.res-link a{font-size:12px;color:#38bdf8;text-decoration:none}
.res-link a:hover{text-decoration:underline}
.res-date{font-size:11px;color:#6b7280}
</style>
</head>
<body>
<a href="../districts/misc/" class="back">→ שונות</a>
<div class="wrap">
<h1>📚 יומן משאבים</h1>
<div class="sub">קורסים, ספרים, כלים, פודקאסטים — הכל במקום אחד</div>

<div class="stats">
  <div class="stat"><div class="num" id="sTotal">0</div><div class="lbl">משאבים</div></div>
  <div class="stat"><div class="num" id="sActive">0</div><div class="lbl">פעיל/לומד</div></div>
  <div class="stat"><div class="num" id="sDone">0</div><div class="lbl">הושלמו</div></div>
</div>

<div class="card">
  <h3>➕ הוסף משאב</h3>
  <div class="form">
    <input type="text" id="rTitle" placeholder="שם המשאב *">
    <div class="form-row">
      <select id="rType">
        <option value="📕 ספר">📕 ספר</option>
        <option value="🎓 קורס">🎓 קורס</option>
        <option value="🎙️ פודקאסט">🎙️ פודקאסט</option>
        <option value="📹 יוטיוב">📹 יוטיוב</option>
        <option value="🔧 כלי">🔧 כלי</option>
        <option value="🌐 אתר">🌐 אתר</option>
        <option value="⭐ אחר">⭐ אחר</option>
      </select>
      <select id="rStatus">
        <option value="רוצה">רוצה 📌</option>
        <option value="פעיל">פעיל 🔥</option>
        <option value="הושלם">הושלם ✅</option>
        <option value="עזבתי">עזבתי ❌</option>
      </select>
    </div>
    <input type="url" id="rLink" placeholder="קישור (אופציונלי)">
    <textarea id="rNote" placeholder="הערות..." style="resize:vertical;min-height:60px"></textarea>
    <button class="btn" onclick="addResource()">שמור משאב</button>
  </div>
</div>

<div class="card">
  <div class="tabs" id="tabsEl">
    <button class="tab active" onclick="setTab('',this)">הכל</button>
    <button class="tab" onclick="setTab('📕 ספר',this)">📕 ספרים</button>
    <button class="tab" onclick="setTab('🎓 קורס',this)">🎓 קורסים</button>
    <button class="tab" onclick="setTab('🎙️ פודקאסט',this)">🎙️ פודקאסטים</button>
    <button class="tab" onclick="setTab('📹 יוטיוב',this)">📹 יוטיוב</button>
  </div>
  <div id="resList"><div style="color:#9aa3b5;font-size:13px;text-align:center;padding:12px">אין משאבים עדיין</div></div>
</div>
</div>

<script>
let resources=JSON.parse(localStorage.getItem('resources_log')||'[]');
let activeTab='';

const STATUS_COLOR={רוצה:'rgba(99,102,241,.2)',פעיל:'rgba(234,179,8,.2)',הושלם:'rgba(22,163,74,.2)',עזבתי:'rgba(107,114,128,.2)'};
const STATUS_TEXT_COLOR={רוצה:'#a5b4fc',פעיל:'#fde68a',הושלם:'#86efac',עזבתי:'#9ca3af'};

function addResource(){
  const title=document.getElementById('rTitle').value.trim();
  if(!title){alert('הזינו שם');return;}
  resources.unshift({id:Date.now(),title,
    type:document.getElementById('rType').value,
    status:document.getElementById('rStatus').value,
    link:document.getElementById('rLink').value.trim(),
    note:document.getElementById('rNote').value.trim(),
    date:new Date().toLocaleDateString('he-IL')});
  ['rTitle','rLink','rNote'].forEach(id=>document.getElementById(id).value='');
  save();render();
}

function delResource(id){resources=resources.filter(r=>r.id!==id);save();render();}
function setTab(t,el){activeTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===el));render();}

function render(){
  const shown=activeTab?resources.filter(r=>r.type===activeTab):resources;
  document.getElementById('sTotal').textContent=resources.length;
  document.getElementById('sActive').textContent=resources.filter(r=>r.status==='פעיל').length;
  document.getElementById('sDone').textContent=resources.filter(r=>r.status==='הושלם').length;
  const el=document.getElementById('resList');
  if(!shown.length){el.innerHTML='<div style="color:#9aa3b5;font-size:13px;text-align:center;padding:12px">אין משאבים</div>';return;}
  el.innerHTML=shown.map(r=>`
    <div class="res-item">
      <div class="res-header">
        <div class="res-title">${r.title}</div>
        <button class="res-del" onclick="delResource(${r.id})">✕</button>
      </div>
      <div class="res-meta">
        <span class="badge" style="background:rgba(2,132,199,.2);color:#38bdf8">${r.type}</span>
        <span class="badge" style="background:${STATUS_COLOR[r.status]||'rgba(0,0,0,.3)'};color:${STATUS_TEXT_COLOR[r.status]||'#9aa3b5'}">${r.status}</span>
      </div>
      ${r.note?`<div class="res-note">${r.note}</div>`:''}
      ${r.link?`<div class="res-link"><a href="${r.link}" target="_blank" rel="noopener">🔗 פתח קישור</a></div>`:''}
      <div class="res-date">${r.date}</div>
    </div>`).join('');
}

function save(){localStorage.setItem('resources_log',JSON.stringify(resources));}
render();
</script>
</body>
</html>
