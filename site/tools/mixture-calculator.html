<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחשבון תערובת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d14;
  --paper: #141826;
  --paper2: #1a2030;
  --ink: #f4f6fb;
  --ink-soft: #9aa3b5;
  --line: rgba(255,255,255,.13);
  --shadow: rgba(0,0,0,.5);
  --a: #f97316;
  --a-dim: rgba(249,115,22,.18);
  --b: #38bdf8;
  --b-dim: rgba(56,189,248,.18);
  --ok: #34d399;
  --err: #f87171;
  --warn: #fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 20% 8%, #131a2e 0%, transparent 55%),
    radial-gradient(circle at 85% 95%, #101626 0%, transparent 50%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Heebo","Segoe UI",system-ui,sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:22px 14px 60px;
  line-height:1.5;
  overflow-x:hidden;
}
.wrap{width:100%;max-width:460px;}

/* ── header ── */
header{text-align:center;margin-bottom:20px;}
.back-link{display:inline-flex;align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);
  border-radius:12px;padding:8px 14px;font:600 13px "Heebo";text-decoration:none;
  margin-bottom:16px;transition:background .15s;}
.back-link:hover{background:var(--paper2);color:var(--ink);}
h1{font-family:"Rubik",sans-serif;font-weight:900;font-size:28px;letter-spacing:-.5px;
  background:linear-gradient(92deg,var(--a),var(--b));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.subtitle{color:var(--ink-soft);font-size:13px;margin-top:4px;}

/* ── tabs ── */
.tabs{display:flex;gap:7px;background:#0e1220;border-radius:14px;padding:5px;margin-bottom:18px;}
.tab{flex:1;border:0;background:transparent;cursor:pointer;padding:11px 8px;border-radius:10px;
  font-size:13px;font-weight:700;color:var(--ink-soft);font-family:inherit;transition:.18s;line-height:1.3;}
.tab.active{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px var(--shadow);}

/* ── cards ── */
.card{background:var(--paper);border-radius:18px;padding:20px;
  box-shadow:0 8px 28px var(--shadow);margin-bottom:14px;}
.card-title{font-family:"Rubik",sans-serif;font-weight:700;font-size:15px;
  color:var(--ink-soft);margin-bottom:16px;letter-spacing:.2px;}

/* ── form fields ── */
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
label.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
.input-row{display:flex;align-items:center;gap:10px;}
input[type=number]{
  width:90px;font-family:inherit;font-size:18px;font-weight:700;color:var(--ink);
  background:#0e1220;border:1.5px solid var(--line);border-radius:11px;
  padding:10px 12px;outline:none;transition:.15s;text-align:center;
  -moz-appearance:textfield;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]:focus{border-color:var(--a);}
input[type=number].err{border-color:var(--err);}
.unit{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}

input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;
  background:#0e1220;border:1.5px solid var(--line);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--a);border:3px solid var(--paper);
  box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;transition:transform .1s;
}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2);}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;
  background:var(--a);border:3px solid var(--paper);
  box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;
}
input[type=range].range-b::-webkit-slider-thumb{background:var(--b);}
input[type=range].range-b::-moz-range-thumb{background:var(--b);}

.pct-display{font-size:13px;color:var(--ink-soft);font-weight:600;min-width:38px;text-align:center;}

/* b% auto display */
.auto-pct{
  background:var(--b-dim);border:1.5px solid rgba(56,189,248,.35);
  border-radius:11px;padding:10px 14px;font-size:17px;font-weight:700;
  color:var(--b);text-align:center;width:90px;
}

/* ── component toggle (tab 2) ── */
.toggle-row{display:flex;gap:8px;margin-bottom:18px;}
.tog{flex:1;border:1.5px solid var(--line);background:#0e1220;cursor:pointer;
  border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:800;
  font-size:15px;color:var(--ink-soft);transition:.15s;text-align:center;}
.tog.active-a{background:var(--a-dim);border-color:var(--a);color:var(--a);}
.tog.active-b{background:var(--b-dim);border-color:var(--b);color:var(--b);}

/* ── error / warning messages ── */
.msg{font-size:12.5px;font-weight:600;margin-top:7px;min-height:18px;
  display:flex;align-items:center;gap:5px;}
.msg.error{color:var(--err);}
.msg.warn{color:var(--warn);}
.msg:empty{display:none;}

/* ── result section ── */
.results{display:flex;flex-direction:column;gap:12px;}
.result-card{border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;}
.rc-a{background:var(--a-dim);border:1.5px solid rgba(249,115,22,.4);}
.rc-b{background:var(--b-dim);border:1.5px solid rgba(56,189,248,.4);}
.rc-total{background:rgba(255,255,255,.05);border:1.5px solid var(--line);}

.rc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.rc-name{font-family:"Rubik",sans-serif;font-weight:900;font-size:16px;}
.rc-name.col-a{color:var(--a);}
.rc-name.col-b{color:var(--b);}
.rc-pct{font-size:14px;font-weight:700;
  background:rgba(0,0,0,.25);border-radius:20px;padding:3px 12px;}
.col-a .rc-pct{color:var(--a);}
.col-b .rc-pct{color:var(--b);}

.rc-grams{font-family:"Rubik",sans-serif;font-weight:900;font-size:38px;
  line-height:1;letter-spacing:-1px;}
.rc-grams-unit{font-size:16px;font-weight:600;color:var(--ink-soft);margin-right:3px;}
.rc-total-row{display:flex;align-items:baseline;gap:8px;}
.rc-total-label{color:var(--ink-soft);font-size:14px;font-weight:600;}
.rc-total-val{font-family:"Rubik",sans-serif;font-weight:900;font-size:30px;}

/* ── ratio bar ── */
.ratio-bar{height:12px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:6px;}
.bar-a{background:var(--a);transition:width .35s cubic-bezier(.4,0,.2,1);}
.bar-b{flex:1;background:var(--b);}
.bar-labels{display:flex;justify-content:space-between;font-size:11.5px;
  font-weight:700;color:var(--ink-soft);}

/* ── name edit ── */
.name-edit{
  background:transparent;border:0;border-bottom:1.5px dashed rgba(255,255,255,.2);
  color:inherit;font:inherit;font-family:"Rubik",sans-serif;font-weight:900;font-size:16px;
  cursor:text;outline:none;width:100%;padding:0 0 1px;
  transition:border-color .15s;
}
.name-edit:focus{border-color:var(--a);}
.name-edit.nb{border-color:transparent;}
.name-edit.nb:focus{border-color:rgba(56,189,248,.6);}

/* ── action buttons ── */
.btn-row{display:flex;gap:10px;margin-top:6px;}
.btn{flex:1;border:0;border-radius:13px;padding:14px;font-family:inherit;
  font-weight:800;font-size:15px;cursor:pointer;transition:.15s;}
.btn-calc{background:linear-gradient(135deg,var(--a),#fb923c);color:#fff;}
.btn-calc:active{filter:brightness(.88);}
.btn-reset{background:var(--paper2);color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-reset:hover{color:var(--ink);}

/* ── over-limit warning banner ── */
.banner{
  border-radius:14px;padding:14px 16px;
  background:rgba(251,191,36,.12);border:1.5px solid rgba(251,191,36,.4);
  color:var(--warn);font-weight:700;font-size:14px;
  display:none;margin-bottom:12px;
  line-height:1.4;
}
.banner.show{display:block;}

/* ── empty state ── */
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:14px;}

/* ── responsive ── */
@media(max-width:380px){
  h1{font-size:23px;}
  .rc-grams{font-size:30px;}
  input[type=number]{width:76px;font-size:16px;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back-link" href="../index.html">→ חזרה לכלים</a>
    <h1>מחשבון תערובת</h1>
    <div class="subtitle">חישוב מדויק של שני רכיבים לפי אחוזים ומשקל</div>
  </header>

  <!-- TABS -->
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab1-btn" role="tab" aria-selected="true"
      onclick="switchTab(1)">אני יודע את<br>המשקל הכולל</button>
    <button class="tab" id="tab2-btn" role="tab" aria-selected="false"
      onclick="switchTab(2)">אני יודע כמה<br>גרם יש לי</button>
  </div>

  <!-- ═══════════ TAB 1 ═══════════ -->
  <div id="tab1" role="tabpanel">

    <div class="card">
      <div class="card-title">פרטי התערובת</div>

      <!-- Total weight -->
      <div class="field">
        <label class="lbl" for="t1-total">משקל כולל רצוי</label>
        <div class="input-row">
          <input type="number" id="t1-total" min="1" max="100" step="0.1" value="10">
          <span class="unit">גרם</span>
          <input type="range" id="t1-total-sl" min="1" max="100" step="0.1" value="10">
        </div>
        <div class="msg error" id="t1-total-err"></div>
      </div>

      <!-- Component A % -->
      <div class="field">
        <label class="lbl" for="t1-pctA">אחוז רכיב A</label>
        <div class="input-row">
          <input type="number" id="t1-pctA" min="5" max="90" step="1" value="70">
          <span class="unit">%</span>
          <input type="range" id="t1-pctA-sl" min="5" max="90" step="1" value="70">
        </div>
        <div class="msg error" id="t1-pctA-err"></div>
      </div>

      <!-- Component B % (auto) -->
      <div class="field">
        <label class="lbl">אחוז רכיב B (אוטומטי)</label>
        <div class="input-row">
          <div class="auto-pct" id="t1-pctB-disp">30%</div>
          <span class="unit">= 100% − אחוז A</span>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-calc" onclick="calcTab1()">חשב תערובת</button>
      <button class="btn btn-reset" onclick="resetAll()">איפוס</button>
    </div>

  </div>

  <!-- ═══════════ TAB 2 ═══════════ -->
  <div id="tab2" style="display:none" role="tabpanel">

    <div class="card">
      <div class="card-title">איזה רכיב ידוע לך?</div>
      <div class="toggle-row">
        <button class="tog active-a" id="tog-a" onclick="setKnown('a')">רכיב A</button>
        <button class="tog" id="tog-b" onclick="setKnown('b')">רכיב B</button>
      </div>

      <!-- Known grams -->
      <div class="field">
        <label class="lbl" for="t2-grams" id="t2-grams-lbl">כמה גרם יש לך מרכיב A?</label>
        <div class="input-row">
          <input type="number" id="t2-grams" min="0.01" max="100" step="0.1" value="9">
          <span class="unit">גרם</span>
          <input type="range" id="t2-grams-sl" min="0.1" max="100" step="0.1" value="9">
        </div>
        <div class="msg error" id="t2-grams-err"></div>
      </div>

      <!-- Known % -->
      <div class="field">
        <label class="lbl" for="t2-pct" id="t2-pct-lbl">איזה אחוז מייצג רכיב A בתערובת?</label>
        <div class="input-row">
          <input type="number" id="t2-pct" min="5" max="90" step="1" value="30">
          <span class="unit">%</span>
          <input type="range" id="t2-pct-sl" class="range-b" min="5" max="90" step="1" value="30">
        </div>
        <div class="msg error" id="t2-pct-err"></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-calc" onclick="calcTab2()">חשב תערובת</button>
      <button class="btn btn-reset" onclick="resetAll()">איפוס</button>
    </div>

  </div>

  <!-- ═══════════ RESULTS ═══════════ -->
  <div style="margin-top:18px;">
    <div class="banner" id="over-banner">⚠️ התוצאה גדולה מהמגבלה של 100 גרם</div>

    <div id="results-area" class="results" style="display:none;">

      <!-- Ratio bar -->
      <div class="card" style="padding:16px 20px;">
        <div class="ratio-bar">
          <div class="bar-a" id="bar-a" style="width:70%"></div>
          <div class="bar-b" id="bar-b"></div>
        </div>
        <div class="bar-labels">
          <span id="bar-label-a">רכיב A · 70%</span>
          <span id="bar-label-b">רכיב B · 30%</span>
        </div>
      </div>

      <!-- Card A -->
      <div class="result-card rc-a">
        <div class="rc-header">
          <div class="rc-name col-a">
            <input class="name-edit" id="name-a" type="text" value="רכיב A"
              aria-label="שם רכיב A" maxlength="20">
          </div>
          <div class="rc-pct col-a" id="res-pctA">70%</div>
        </div>
        <div>
          <span class="rc-grams" id="res-grA">7</span>
          <span class="rc-grams-unit">גרם</span>
        </div>
      </div>

      <!-- Card B -->
      <div class="result-card rc-b">
        <div class="rc-header">
          <div class="rc-name col-b">
            <input class="name-edit nb" id="name-b" type="text" value="רכיב B"
              aria-label="שם רכיב B" maxlength="20">
          </div>
          <div class="rc-pct col-b" id="res-pctB">30%</div>
        </div>
        <div>
          <span class="rc-grams" id="res-grB">3</span>
          <span class="rc-grams-unit">גרם</span>
        </div>
      </div>

      <!-- Total -->
      <div class="result-card rc-total">
        <div class="rc-total-row">
          <span class="rc-total-label">סה"כ תערובת:</span>
          <span class="rc-total-val" id="res-total">10</span>
          <span class="rc-grams-unit">גרם</span>
        </div>
      </div>

    </div>
  </div>

</div><!-- /wrap -->

<script>
// ── state ────────────────────────────────────────────────────────────────────
const S = {
  tab: 1,
  total: 10,
  pctA: 70,
  knownComp: 'a',
  knownGrams: 9,
  knownPct: 30,
  nameA: 'רכיב A',
  nameB: 'רכיב B',
};

// ── localStorage ──────────────────────────────────────────────────────────────
function saveLS() {
  try {
    localStorage.setItem('mixture_tab',       S.tab);
    localStorage.setItem('mixture_total',     S.total);
    localStorage.setItem('mixture_pctA',      S.pctA);
    localStorage.setItem('mixture_known_comp',S.knownComp);
    localStorage.setItem('mixture_known_grams',S.knownGrams);
    localStorage.setItem('mixture_known_pct', S.knownPct);
    localStorage.setItem('mixture_name_a',    S.nameA);
    localStorage.setItem('mixture_name_b',    S.nameB);
  } catch(e){}
}
function loadLS() {
  try {
    const t   = parseInt(localStorage.getItem('mixture_tab'));
    const tot = parseFloat(localStorage.getItem('mixture_total'));
    const pA  = parseFloat(localStorage.getItem('mixture_pctA'));
    const kc  = localStorage.getItem('mixture_known_comp');
    const kg  = parseFloat(localStorage.getItem('mixture_known_grams'));
    const kp  = parseFloat(localStorage.getItem('mixture_known_pct'));
    const na  = localStorage.getItem('mixture_name_a');
    const nb  = localStorage.getItem('mixture_name_b');
    if (t===1||t===2)     S.tab        = t;
    if (isFinite(tot))    S.total      = tot;
    if (isFinite(pA))     S.pctA       = pA;
    if (kc==='a'||kc==='b') S.knownComp = kc;
    if (isFinite(kg))     S.knownGrams = kg;
    if (isFinite(kp))     S.knownPct   = kp;
    if (na)               S.nameA      = na;
    if (nb)               S.nameB      = nb;
  } catch(e){}
}

// ── helpers ───────────────────────────────────────────────────────────────────
function fmt(n) {
  if (!isFinite(n)) return '—';
  // round to 2 decimals, strip trailing zeros
  return +n.toFixed(2) + '';
}

function setVal(id, v) { document.getElementById(id).value = v; }
function setText(id, v) { document.getElementById(id).textContent = v; }
function setErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'msg ' + (msg ? 'error' : '');
}

function validateTotal(v) {
  if (v === '' || v === null) return 'נא להזין משקל';
  const n = parseFloat(v);
  if (!isFinite(n)) return 'יש להזין מספר תקין';
  if (n < 1)   return 'משקל מינימלי: 1 גרם';
  if (n > 100) return 'משקל מקסימלי: 100 גרם';
  return '';
}
function validatePct(v) {
  if (v === '' || v === null) return 'נא להזין אחוז';
  const n = parseFloat(v);
  if (!isFinite(n)) return 'יש להזין מספר תקין';
  if (n < 5)  return 'אחוז מינימלי: 5%';
  if (n > 90) return 'אחוז מקסימלי: 90%';
  return '';
}
function validateGrams(v) {
  if (v === '' || v === null) return 'נא להזין גרמים';
  const n = parseFloat(v);
  if (!isFinite(n)) return 'יש להזין מספר תקין';
  if (n <= 0)  return 'יש להזין כמות חיובית';
  return '';
}

// ── sync pairs ────────────────────────────────────────────────────────────────
function linkPair(inputId, sliderId, onchange) {
  const inp = document.getElementById(inputId);
  const sl  = document.getElementById(sliderId);
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    if (isFinite(v)) sl.value = v;
    onchange();
  });
  sl.addEventListener('input', () => {
    inp.value = sl.value;
    onchange();
  });
}

// ── Tab 1 logic ───────────────────────────────────────────────────────────────
function updatePctB1() {
  const pA = parseFloat(document.getElementById('t1-pctA').value);
  const pB = isFinite(pA) ? Math.round((100 - pA) * 100) / 100 : '—';
  document.getElementById('t1-pctB-disp').textContent = isFinite(pA) ? pB + '%' : '—';
}

function calcTab1() {
  const totalRaw = document.getElementById('t1-total').value;
  const pctARaw  = document.getElementById('t1-pctA').value;
  const eT = validateTotal(totalRaw);
  const eP = validatePct(pctARaw);
  setErr('t1-total-err', eT);
  setErr('t1-pctA-err', eP);
  if (eT || eP) { hideResults(); return; }

  const total = parseFloat(totalRaw);
  const pctA  = parseFloat(pctARaw);
  const pctB  = 100 - pctA;

  const aRaw = total * pctA / 100;

  // rounding: A rounded, B = total − rounded A to guarantee sum
  const aDisp = parseFloat(aRaw.toFixed(2));
  const bDisp = parseFloat((total - aDisp).toFixed(2));

  S.total = total; S.pctA = pctA;
  saveLS();
  showResults(pctA, pctB, aDisp, bDisp, total, false);
}

// ── Tab 2 logic ───────────────────────────────────────────────────────────────
let knownComp = 'a';

function setKnown(c) {
  knownComp = c;
  S.knownComp = c;
  document.getElementById('tog-a').className = 'tog' + (c==='a' ? ' active-a' : '');
  document.getElementById('tog-b').className = 'tog' + (c==='b' ? ' active-b' : '');
  const nameA = document.getElementById('name-a').value || 'רכיב A';
  const nameB = document.getElementById('name-b').value || 'רכיב B';
  const nm = c === 'a' ? nameA : nameB;
  document.getElementById('t2-grams-lbl').textContent = `כמה גרם יש לך מ${nm}?`;
  document.getElementById('t2-pct-lbl').textContent   = `איזה אחוז מייצג ${nm} בתערובת?`;
  saveLS();
  calcTab2();
}

function calcTab2() {
  const grRaw  = document.getElementById('t2-grams').value;
  const pctRaw = document.getElementById('t2-pct').value;
  const eG = validateGrams(grRaw);
  const eP = validatePct(pctRaw);
  setErr('t2-grams-err', eG);
  setErr('t2-pct-err',   eP);
  if (eG || eP) { hideResults(); return; }

  const knownGrams = parseFloat(grRaw);
  const knownPct   = parseFloat(pctRaw);

  const total = knownGrams / knownPct * 100;

  if (!isFinite(total) || total <= 0) {
    setErr('t2-grams-err', 'חישוב לא תקין — בדוק את הערכים');
    hideResults(); return;
  }

  const secondGrams = total - knownGrams;
  const secondPct   = 100 - knownPct;

  let pctA, pctB, aGrams, bGrams;
  if (knownComp === 'a') {
    pctA = knownPct; pctB = secondPct;
    aGrams = parseFloat(knownGrams.toFixed(2));
    bGrams = parseFloat((total - aGrams).toFixed(2));
  } else {
    pctB = knownPct; pctA = secondPct;
    bGrams = parseFloat(knownGrams.toFixed(2));
    aGrams = parseFloat((total - bGrams).toFixed(2));
  }

  S.knownGrams = knownGrams; S.knownPct = knownPct;
  saveLS();
  const overLimit = total > 100;
  showResults(pctA, pctB, aGrams, bGrams, parseFloat(total.toFixed(2)), overLimit);
}

// ── display results ───────────────────────────────────────────────────────────
function showResults(pctA, pctB, aGrams, bGrams, total, overLimit) {
  document.getElementById('over-banner').className = 'banner' + (overLimit ? ' show' : '');
  document.getElementById('results-area').style.display = 'flex';

  const nameA = document.getElementById('name-a').value || 'רכיב A';
  const nameB = document.getElementById('name-b').value || 'רכיב B';

  setText('res-pctA', fmt(pctA) + '%');
  setText('res-pctB', fmt(pctB) + '%');
  setText('res-grA',  fmt(aGrams));
  setText('res-grB',  fmt(bGrams));
  setText('res-total', fmt(total));

  document.getElementById('bar-a').style.width = pctA + '%';
  setText('bar-label-a', nameA + ' · ' + fmt(pctA) + '%');
  setText('bar-label-b', nameB + ' · ' + fmt(pctB) + '%');
}

function hideResults() {
  document.getElementById('results-area').style.display = 'none';
  document.getElementById('over-banner').className = 'banner';
}

// ── tabs ──────────────────────────────────────────────────────────────────────
function switchTab(n) {
  S.tab = n;
  saveLS();
  document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
  document.getElementById('tab2').style.display = n===2 ? 'block' : 'none';
  document.getElementById('tab1-btn').className = 'tab' + (n===1 ? ' active' : '');
  document.getElementById('tab2-btn').className = 'tab' + (n===2 ? ' active' : '');
  document.getElementById('tab1-btn').setAttribute('aria-selected', n===1);
  document.getElementById('tab2-btn').setAttribute('aria-selected', n===2);
  hideResults();
  if (n===1) calcTab1(); else calcTab2();
}

// ── reset ─────────────────────────────────────────────────────────────────────
function resetAll() {
  setVal('t1-total',    10);
  setVal('t1-total-sl', 10);
  setVal('t1-pctA',     70);
  setVal('t1-pctA-sl',  70);
  setVal('t2-grams',    9);
  setVal('t2-grams-sl', 9);
  setVal('t2-pct',      30);
  setVal('t2-pct-sl',   30);
  document.getElementById('name-a').value = 'רכיב A';
  document.getElementById('name-b').value = 'רכיב B';
  updatePctB1();
  setErr('t1-total-err',''); setErr('t1-pctA-err','');
  setErr('t2-grams-err',''); setErr('t2-pct-err','');
  Object.assign(S, {total:10,pctA:70,knownComp:'a',knownGrams:9,knownPct:30,nameA:'רכיב A',nameB:'רכיב B'});
  setKnown('a');
  saveLS();
  if (S.tab === 1) calcTab1(); else calcTab2();
}

// ── init ──────────────────────────────────────────────────────────────────────
loadLS();

// restore values
setVal('t1-total',     S.total);
setVal('t1-total-sl',  S.total);
setVal('t1-pctA',      S.pctA);
setVal('t1-pctA-sl',   S.pctA);
setVal('t2-grams',     S.knownGrams);
setVal('t2-grams-sl',  S.knownGrams);
setVal('t2-pct',       S.knownPct);
setVal('t2-pct-sl',    S.knownPct);
document.getElementById('name-a').value = S.nameA;
document.getElementById('name-b').value = S.nameB;

// wire live sync
linkPair('t1-total',  't1-total-sl',  () => { updatePctB1(); calcTab1(); });
linkPair('t1-pctA',   't1-pctA-sl',   () => { updatePctB1(); calcTab1(); });
linkPair('t2-grams',  't2-grams-sl',  calcTab2);
linkPair('t2-pct',    't2-pct-sl',    calcTab2);

// name edits update bar labels live
document.getElementById('name-a').addEventListener('input', () => {
  S.nameA = document.getElementById('name-a').value;
  saveLS();
  if (S.tab===1) calcTab1(); else calcTab2();
  setKnown(knownComp);
});
document.getElementById('name-b').addEventListener('input', () => {
  S.nameB = document.getElementById('name-b').value;
  saveLS();
  if (S.tab===1) calcTab1(); else calcTab2();
  setKnown(knownComp);
});

// init display
knownComp = S.knownComp;
updatePctB1();
setKnown(S.knownComp);
switchTab(S.tab);
</script>
