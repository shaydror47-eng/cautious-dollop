<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב ניצחונות — המרכז שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d14;color:#f4f6fb;font-family:'Heebo',sans-serif;min-height:100vh;padding:20px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  background:#141826;border:1px solid rgba(255,255,255,.1);color:#f4f6fb;
  border-radius:14px;padding:10px 18px;font:700 14px 'Heebo';text-decoration:none}
.back:hover{background:#1c2233}
h1{font-family:'Rubik';font-size:28px;font-weight:900;margin-bottom:4px}
.sub{color:#9aa3b5;font-size:13px;margin-bottom:24px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#b45309,#92400e,#78350f);border-radius:22px;
  padding:24px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:'🏆';font-size:100px;position:absolute;left:-10px;top:-10px;opacity:.2}
.hero-num{font-family:'Rubik';font-size:52px;font-weight:900}
.hero-lbl{font-size:13px;opacity:.8;margin-top:4px}
.card{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-family:'Rubik';font-size:14px;color:#9aa3b5;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.form select,.form textarea{background:#0d1117;border:1px solid rgba(255,255,255,.15);
  color:#f4f6fb;font:500 14px 'Heebo';border-radius:12px;padding:11px 14px;width:100%}
.form textarea{resize:vertical;min-height:65px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row > *{flex:1;min-width:120px}
.btn{padding:12px;border-radius:12px;border:none;font:700 14px 'Heebo';cursor:pointer;
  background:linear-gradient(135deg,#d97706,#b45309);color:#fff;transition:opacity .15s;width:100%}
.btn:hover{opacity:.85}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat{padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:transparent;color:#9aa3b5;font:600 12px 'Heebo';cursor:pointer}
.cat.active{background:rgba(217,119,6,.2);border-color:#d97706;color:#fbbf24}
.win-item{background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:14px;
  padding:14px;margin-bottom:8px;position:relative}
.win-item:hover{border-color:rgba(251,191,36,.2)}
.win-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.win-title{font-family:'Rubik';font-size:16px;font-weight:700}
.win-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.win-date{font-size:11px;color:#9aa3b5;margin-top:4px}
.win-note{font-size:13px;color:#d1d5db;margin-top:6px;line-height:1.5}
.win-del{position:absolute;bottom:10px;left:10px;background:none;border:none;color:#6b7280;cursor:pointer;font-size:15px}
.win-del:hover{color:#ef4444}
.impact-1{background:rgba(22,163,74,.15);color:#4ade80}
.impact-2{background:rgba(234,179,8,.15);color:#fef08a}
.impact-3{background:rgba(220,38,38,.15);color:#fca5a5}
</style>
</head>
<body>
<a href="../districts/misc/" class="back">→ שונות</a>
<div class="wrap">
<h1>🏆 מעקב ניצחונות</h1>
<div class="sub">כל הגיה וכל הצלחה — כולה נרשמת</div>

<div class="hero">
  <div class="hero-num" id="heroNum">0 🏆</div>
  <div class="hero-lbl">ניצחונות רשומים</div>
</div>

<div class="card">
  <h3>➕ הוסף ניצחון</h3>
  <div class="form">
    <input type="text" id="wTitle" placeholder="מה הצלחת? *">
    <div class="form-row">
      <select id="wCategory">
        <option value="💼 עסקי">💼 עסקי</option>
        <option value="💪 כושר">💪 כושר</option>
        <option value="📚 למידה">📚 למידה</option>
        <option value="💰 כסף">💰 כסף</option>
        <option value="🤝 מערכות יחסים">🤝 מערכות יחסים</option>
        <option value="🧠 מנטלי">🧠 מנטלי</option>
        <option value="⭐ אחר">⭐ אחר</option>
      </select>
      <select id="wImpact">
        <option value="1">קטן 🌱</option>
        <option value="2" selected>בינוני ⭐</option>
        <option value="3">גדול 🚀</option>
      </select>
    </div>
    <textarea id="wNote" placeholder="ספרו יותר... (אופציונלי)"></textarea>
    <button class="btn" onclick="addWin()">🏆 שמור ניצחון</button>
  </div>
</div>

<div class="card">
  <h3>📋 כל הניצחונות</h3>
  <div class="cats" id="catFilter">
    <button class="cat active" onclick="setFilter('',this)">הכל</button>
    <button class="cat" onclick="setFilter('💼 עסקי',this)">💼 עסקי</button>
    <button class="cat" onclick="setFilter('💪 כושר',this)">💪 כושר</button>
    <button class="cat" onclick="setFilter('📚 למידה',this)">📚 למידה</button>
    <button class="cat" onclick="setFilter('💰 כסף',this)">💰 כסף</button>
  </div>
  <div id="winList"><div style="color:#9aa3b5;font-size:13px;text-align:center;padding:12px">אין ניצחונות עדיין — הוסיפו את הראשון!</div></div>
</div>
</div>

<script>
let wins=JSON.parse(localStorage.getItem('wins_tracker')||'[]');
let filter='';

const IMPACT_LABELS={1:'קטן 🌱',2:'בינוני ⭐',3:'גדול 🚀'};
const IMPACT_CLS={1:'impact-1',2:'impact-2',3:'impact-3'};

function addWin(){
  const title=document.getElementById('wTitle').value.trim();
  if(!title){alert('כתבו כותרת לניצחון');return;}
  wins.unshift({id:Date.now(),title,category:document.getElementById('wCategory').value,
    impact:parseInt(document.getElementById('wImpact').value),
    note:document.getElementById('wNote').value.trim(),
    date:new Date().toLocaleDateString('he-IL')});
  ['wTitle','wNote'].forEach(id=>document.getElementById(id).value='');
  save();render();
}

function delWin(id){wins=wins.filter(w=>w.id!==id);save();render();}
function setFilter(f,el){filter=f;document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('active',c===el));render();}

function render(){
  document.getElementById('heroNum').textContent=wins.length+' 🏆';
  const shown=filter?wins.filter(w=>w.category===filter):wins;
  const el=document.getElementById('winList');
  if(!shown.length){el.innerHTML='<div style="color:#9aa3b5;font-size:13px;text-align:center;padding:12px">אין ניצחונות בקטגוריה זו</div>';return;}
  el.innerHTML=shown.map(w=>`
    <div class="win-item">
      <div class="win-header">
        <div class="win-title">${w.title}</div>
        <div class="win-badge ${IMPACT_CLS[w.impact]}">${IMPACT_LABELS[w.impact]}</div>
      </div>
      <div style="font-size:12px;color:#fbbf24;font-weight:700">${w.category}</div>
      ${w.note?`<div class="win-note">${w.note}</div>`:''}
      <div class="win-date">${w.date}</div>
      <button class="win-del" onclick="delWin(${w.id})">🗑</button>
    </div>`).join('');
}

function save(){localStorage.setItem('wins_tracker',JSON.stringify(wins));}
render();
</script>
</body>
</html>
