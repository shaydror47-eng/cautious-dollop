<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת מיקרופון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--text:#f4f6fb;--muted:#9aa3b5;--card:#141826;--line:rgba(255,255,255,.08);
--accent:#f9763b;--accent2:#e8453c;--ok:#34d399;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 110px}
h1{font-family:'Rubik';font-weight:900;font-size:28px;text-align:center;padding:14px 0 4px;
 background:linear-gradient(92deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.card h2{font-family:'Rubik';font-weight:700;font-size:17px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
select{width:100%;background:#0e1220;border:1px solid var(--line);border-radius:14px;color:var(--text);
 font:500 15px 'Heebo';padding:13px;outline:none;-webkit-appearance:none;appearance:none}
select:focus{border-color:var(--accent)}
.level-bar{height:20px;background:#0e1220;border-radius:30px;overflow:hidden;border:1px solid var(--line);margin-top:14px}
.level-fill{height:100%;border-radius:30px;transition:width 80ms;min-width:0;
 background:linear-gradient(90deg,var(--ok),#10b981)}
.level-fill.hot{background:linear-gradient(90deg,var(--accent),var(--red))}
.level-text{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}

canvas{width:100%;height:80px;margin-top:12px;border-radius:14px;background:#0e1220;border:1px solid var(--line)}

.btn{display:block;width:100%;border:none;cursor:pointer;color:#fff;font-family:'Rubik';font-weight:900;
 font-size:20px;border-radius:20px;padding:18px;margin-top:16px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.test{background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 10px 24px rgba(37,99,235,.4)}
.btn.playing{background:linear-gradient(135deg,var(--ok),#047857);box-shadow:0 10px 24px rgba(16,185,129,.4)}
.btn:disabled{opacity:.4;pointer-events:none}

.device-list{list-style:none;margin-top:12px}
.device-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;
 background:#0e1220;border:1px solid var(--line);border-radius:12px;margin-top:6px;font-size:14px}
.device-list .dot{width:10px;height:10px;border-radius:50%;flex:none}
.device-list .dot.audio{background:var(--ok)}
.device-list .dot.video{background:#3b82f6}

.status{text-align:center;padding:10px;border-radius:14px;margin-top:14px;font-size:14px;font-weight:700}
.status.ok{background:rgba(52,211,153,.12);color:var(--ok)}
.status.err{background:rgba(239,68,68,.12);color:var(--red)}
.status.info{background:rgba(59,130,246,.12);color:#60a5fa}

.home{position:fixed;bottom:18px;left:18px;z-index:9;color:#fff;border:none;text-decoration:none;
 background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-radius:30px;padding:13px 20px;font:800 14.5px 'Heebo';
 box-shadow:0 10px 24px rgba(109,40,217,.5);transition:transform .15s}
.home:active{transform:scale(.93)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔊 בדיקת מיקרופון</h1>
  <div class="sub">וידוא שהדיבורית מחוברת ועובדת · לפני נסיעה</div>

  <div class="card">
    <h2>📋 מכשירי שמע מחוברים</h2>
    <ul class="device-list" id="deviceList"></ul>
  </div>

  <div class="card">
    <h2>🎧 בחירת מיקרופון לבדיקה</h2>
    <label>מקור שמע</label>
    <select id="micSelect"><option value="">טוען...</option></select>
    <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
    <div class="level-text" id="levelText">בחר מיקרופון</div>
    <canvas id="waveCanvas"></canvas>
  </div>

  <div id="statusBox" class="status hidden"></div>

  <button class="btn test" id="testBtn" disabled>🎤 הקלט 5 שניות ונגן</button>
</div>

<a class="home" href="../index.html">🏠 ראשי</a>

<script>
const micSelect = document.getElementById('micSelect');
const levelFill = document.getElementById('levelFill');
const levelText = document.getElementById('levelText');
const deviceList = document.getElementById('deviceList');
const testBtn = document.getElementById('testBtn');
const statusBox = document.getElementById('statusBox');
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');

let stream = null;
let audioCtx = null;
let analyser = null;
let animFrame = null;

function showStatus(msg, type) {
  statusBox.textContent = msg;
  statusBox.className = 'status ' + type;
  statusBox.classList.remove('hidden');
}

async function loadDevices() {
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    deviceList.innerHTML = '';
    devices.forEach(d => {
      if (d.kind !== 'audioinput' && d.kind !== 'audiooutput') return;
      const li = document.createElement('li');
      const isInput = d.kind === 'audioinput';
      li.innerHTML = '<div class="dot ' + (isInput ? 'audio' : 'video') + '"></div>' +
        '<div><div>' + (d.label || 'מכשיר ללא שם') + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">' + (isInput ? 'קלט (מיקרופון)' : 'פלט (רמקול)') + '</div></div>';
      deviceList.appendChild(li);
    });

    const inputs = devices.filter(d => d.kind === 'audioinput');
    micSelect.innerHTML = '';
    if (inputs.length === 0) {
      micSelect.innerHTML = '<option value="">לא נמצאו מיקרופונים</option>';
      return;
    }
    inputs.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || ('מיקרופון ' + (i + 1));
      micSelect.appendChild(opt);
    });
    testBtn.disabled = false;
    startMonitor(inputs[0].deviceId);
  } catch (e) {
    showStatus('אין הרשאת מיקרופון — אשר גישה ונסה שוב', 'err');
  }
}

async function startMonitor(deviceId) {
  stopMonitor();
  if (!deviceId) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: { exact: deviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    drawLevel();
  } catch (e) {
    showStatus('שגיאה בגישה למיקרופון', 'err');
  }
}

function drawLevel() {
  if (!analyser) return;
  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(data);
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  const pct = Math.min(100, (avg / 128) * 100);
  levelFill.style.width = pct + '%';
  levelFill.className = 'level-fill' + (pct > 75 ? ' hot' : '');
  levelText.textContent = pct < 2 ? 'אין שמע — בדוק חיבור דיבורית' : 'רמת שמע: ' + Math.round(pct) + '%';

  const timeData = new Uint8Array(bufLen);
  analyser.getByteTimeDomainData(timeData);
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 3;
  ctx.strokeStyle = pct > 75 ? '#f9763b' : '#34d399';
  ctx.beginPath();
  const sliceW = canvas.width / bufLen;
  let x = 0;
  for (let i = 0; i < bufLen; i++) {
    const v = timeData[i] / 128.0;
    const y = (v * canvas.height) / 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceW;
  }
  ctx.stroke();
  animFrame = requestAnimationFrame(drawLevel);
}

function stopMonitor() {
  if (animFrame) cancelAnimationFrame(animFrame);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  analyser = null;
}

micSelect.addEventListener('change', () => {
  startMonitor(micSelect.value);
  testBtn.disabled = !micSelect.value;
});

testBtn.addEventListener('click', async () => {
  if (!stream) return;
  testBtn.disabled = true;
  testBtn.textContent = '⏺ מקליט... 5 שניות';
  testBtn.className = 'btn playing';
  showStatus('מקליט 5 שניות...', 'info');

  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
  const chunks = [];
  const rec = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: rec.mimeType });
    const url = URL.createObjectURL(blob);
    showStatus('מנגן...', 'ok');
    testBtn.textContent = '🔊 מנגן...';
    const audio = new Audio(url);
    audio.onended = () => {
      URL.revokeObjectURL(url);
      testBtn.textContent = '🎤 הקלט 5 שניות ונגן';
      testBtn.className = 'btn test';
      testBtn.disabled = false;
      showStatus('בדיקה הושלמה! אם שמעת את עצמך — הדיבורית עובדת ✓', 'ok');
    };
    audio.play();
  };
  rec.start();
  setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 5000);
});

navigator.mediaDevices.addEventListener('devicechange', loadDevices);
loadDevices();
</script>
</body>
</html>
