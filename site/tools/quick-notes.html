<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הערות מהירות — המרכז שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d14;color:#f4f6fb;font-family:'Heebo',sans-serif;min-height:100vh;padding:20px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  background:#141826;border:1px solid rgba(255,255,255,.1);color:#f4f6fb;
  border-radius:14px;padding:10px 18px;font:700 14px 'Heebo';text-decoration:none}
.back:hover{background:#1c2233}
h1{font-family:'Rubik';font-size:28px;font-weight:900;margin-bottom:4px}
.sub{color:#9aa3b5;font-size:13px;margin-bottom:24px}
.wrap{max-width:700px;margin:0 auto}
.add-box{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;margin-bottom:14px}
.add-box textarea{width:100%;background:#0d1117;border:1px solid rgba(255,255,255,.12);
  color:#f4f6fb;font:500 15px 'Heebo';border-radius:12px;padding:13px;resize:none;
  min-height:90px;line-height:1.6;margin-bottom:10px}
.add-box textarea:focus{outline:none;border-color:rgba(99,102,241,.5)}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-row input{flex:1;min-width:100px;background:#0d1117;border:1px solid rgba(255,255,255,.12);
  color:#f4f6fb;font:500 13px 'Heebo';border-radius:10px;padding:9px 12px}
.color-dots{display:flex;gap:6px}
.cd{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
.cd.active{border-color:white}
.btn{padding:10px 20px;border-radius:11px;border:none;font:700 14px 'Heebo';cursor:pointer;
  background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.85}
.search{background:#141826;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;
  margin-bottom:14px;display:flex;gap:10px;align-items:center}
.search input{flex:1;background:none;border:none;color:#f4f6fb;font:500 14px 'Heebo'}
.search input:focus{outline:none}
.notes-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.notes-grid{grid-template-columns:1fr 1fr}}
.note-card{border-radius:16px;padding:14px;position:relative;border:1px solid rgba(255,255,255,.1)}
.note-card.pin{border-style:solid;border-width:2px}
.note-tag{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:6px;letter-spacing:.04em}
.note-text{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.note-date{font-size:11px;color:rgba(255,255,255,.35);margin-top:8px}
.note-actions{position:absolute;top:10px;left:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.note-card:hover .note-actions{opacity:1}
.na{background:rgba(0,0,0,.4);border:none;color:rgba(255,255,255,.7);border-radius:7px;
  padding:5px 8px;cursor:pointer;font-size:13px}
.na:hover{color:white}
</style>
</head>
<body>
<a href="../districts/misc/" class="back">→ שונות</a>
<div class="wrap">
<h1>📌 הערות מהירות</h1>
<div class="sub">מחשבה → שמירה → הלאה</div>

<div class="add-box">
  <textarea id="noteText" placeholder="כתבו הערה..."></textarea>
  <div class="add-row">
    <input type="text" id="noteTag" placeholder="תגית (אופציונלי)">
    <div class="color-dots" id="colorDots"></div>
    <button class="btn" onclick="addNote()">שמור</button>
  </div>
</div>

<div class="search">
  <span style="color:#9aa3b5">🔍</span>
  <input type="text" id="searchInput" placeholder="חיפוש הערות..." oninput="render()">
</div>

<div class="notes-grid" id="grid"></div>
</div>

<script>
const COLORS=['#1e293b','#1a1030','#0a1e0f','#1a0e00','#0a0f1e','#1a0010'];
const CLABELS=['כחול','סגול','ירוק','כתום','לילה','אדום'];
let notes=JSON.parse(localStorage.getItem('qnotes')||'[]');
let selColor=COLORS[0];

document.getElementById('colorDots').innerHTML=COLORS.map((c,i)=>`
  <div class="cd ${i===0?'active':''}" style="background:${c}" onclick="pickColor(${i})" title="${CLABELS[i]}"></div>`).join('');

function pickColor(i){
  selColor=COLORS[i];
  document.querySelectorAll('.cd').forEach((d,j)=>d.classList.toggle('active',i===j));
}

function addNote(){
  const text=document.getElementById('noteText').value.trim();
  if(!text)return;
  notes.unshift({id:Date.now(),text,tag:document.getElementById('noteTag').value.trim(),
    color:selColor,pin:false,date:new Date().toLocaleString('he-IL')});
  document.getElementById('noteText').value='';document.getElementById('noteTag').value='';
  save();render();
}

function delNote(id){notes=notes.filter(n=>n.id!==id);save();render();}
function pinNote(id){notes=notes.map(n=>n.id===id?{...n,pin:!n.pin}:n);save();render();}

function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let shown=notes.filter(n=>!q||n.text.toLowerCase().includes(q)||(n.tag||'').toLowerCase().includes(q));
  shown=[...shown.filter(n=>n.pin),...shown.filter(n=>!n.pin)];
  const el=document.getElementById('grid');
  if(!shown.length){el.innerHTML='<div style="color:#9aa3b5;font-size:13px;text-align:center;padding:16px;grid-column:1/-1">אין הערות</div>';return;}
  el.innerHTML=shown.map(n=>`
    <div class="note-card ${n.pin?'pin':''}" style="background:${n.color};${n.pin?'border-color:rgba(255,255,255,.3)':''}">
      <div class="note-actions">
        <button class="na" onclick="pinNote(${n.id})" title="${n.pin?'הסר נעיצה':'נעץ'}">${n.pin?'📌':'📍'}</button>
        <button class="na" onclick="delNote(${n.id})">✕</button>
      </div>
      ${n.tag?`<div class="note-tag">#${n.tag}</div>`:''}
      <div class="note-text">${n.text.replace(/</g,'&lt;')}</div>
      <div class="note-date">${n.date}</div>
    </div>`).join('');
}

function save(){localStorage.setItem('qnotes',JSON.stringify(notes));}
render();
document.getElementById('noteText').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')addNote();});
</script>
</body>
</html>
